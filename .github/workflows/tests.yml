name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy matplotlib pytest z3-solver duckdb
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Quickstart on synthetic data (same commands as the README)
        run: |
          python scripts/make_synthetic_data.py --out "$RUNNER_TEMP/synthetic_mimic"
          MIMIC_DIR="$RUNNER_TEMP/synthetic_mimic" python scripts/data_demo.py all
          MIMIC_DIR="$RUNNER_TEMP/synthetic_mimic" python scripts/patient_overlap_check.py
          python scripts/run_eval.py --plans tests/data/toy_labeled_plans.json --rules tests.toy_rules
          python scripts/run_eval.py --plans tests/data/catalog_labeled_plans.json --rules clinverify.rules.catalog
