# Airflow on a GCP VM (TA checklist §3). Not Cloud Composer.
# Local Mac development can keep using `airflow standalone` (docs/airflow_setup.md).
#
# On the VM:
#   1. Clone this repo and put the ~36 MB working set under MIMIC_DIR
#   2. export AIRFLOW_UID=$(id -u) MIMIC_DIR=/path/to/mimic
#   3. docker compose up -d
#   4. Open http://<vm-ip>:8080 and unpause clinverify_pipeline
#
# The DAG file is mounted read-only from ./dags. Patient text stays on the VM disk.

x-airflow-common: &airflow-common
  image: apache/airflow:3.0.2-python3.12
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW_VAR_MIMIC_DIR: ${MIMIC_DIR:?set MIMIC_DIR to the VM path that holds the 36 MB working set}
    # Repo scripts run on the host/venv when using BashOperator paths from the DAG;
    # mount the repo so the DAG file and scripts are visible.
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./scripts:/opt/airflow/scripts:ro
    - ./src:/opt/airflow/src:ro
    - ${MIMIC_DIR}:${MIMIC_DIR}:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
